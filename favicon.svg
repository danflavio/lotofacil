<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c6fff"/>
      <stop offset="100%" style="stop-color:#56e6a7"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.3)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>
  
  <!-- Fundo com gradiente roxo → verde -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#bg)"/>
  
  <!-- Brilho sutil -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#shine)"/>
  
  <!-- Bola principal central -->
  <circle cx="32" cy="28" r="14" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.6)" stroke-width="1.5"/>
  <text x="32" y="33" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="900" fill="#fff">15</text>
  
  <!-- Pontos orbitais representando dados/IA -->
  <circle cx="16" cy="44" r="4" fill="rgba(255,255,255,0.5)"/>
  <circle cx="28" cy="50" r="3" fill="rgba(255,255,255,0.35)"/>
  <circle cx="40" cy="48" r="3.5" fill="rgba(255,255,255,0.4)"/>
  <circle cx="50" cy="42" r="4.5" fill="rgba(255,255,255,0.5)"/>
  
  <!-- Linhas de conexão neural -->
  <line x1="20" y1="44" x2="28" y2="50" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
  <line x1="28" y1="50" x2="40" y2="48" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
  <line x1="40" y1="48" x2="50" y2="42" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
  <line x1="32" y1="42" x2="16" y2="44" stroke="rgba(255,255,255,0.15)" stroke-width="0.8"/>
  <line x1="32" y1="42" x2="50" y2="42" stroke="rgba(255,255,255,0.15)" stroke-width="0.8"/>
</svg>
